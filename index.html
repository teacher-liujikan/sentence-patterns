<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>句型練習室</title>
<meta name="description" content="國小國語複句句型：選版本、選年段，看句型和複句分類，還有配對遊戲和學力檢測大亂鬥。">
<style>
@font-face{
  font-family:"EduKai";
  src:url("fonts/edukai-4.0.woff2") format("woff2"),
      url("https://teacher-liujikan.github.io/sentence-patterns/fonts/edukai-4.0.woff2") format("woff2");
  font-display:swap;
}
:root{
  color-scheme:light;
  --bg:#fdf6e9; --paper:#fffdf8; --ink:#3a2e22; --soft:#7a6a58; --line:#eadfcb;
  --accent:#e2703a; --accent2:#2f8f83; --good:#2e9d5b; --bad:#d64545; --gold:#f2b632;
  --radius:18px; --shadow:0 4px 0 rgba(90,60,30,.12), 0 8px 24px rgba(90,60,30,.08);
  --c-並列:#3b82c4; --c-連貫:#2e9d5b; --c-轉折:#e2703a; --c-因果:#d64545; --c-條件:#8a63d2;
  --c-假設:#1e9fb0; --c-遞進:#d4508f; --c-目的:#b8860b; --c-選擇:#4c5fd5;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"EduKai","TW-Kai","標楷體","DFKai-SB","BiauKai","Kaiti TC",serif;
  font-size:20px;line-height:1.6;
  background-image:radial-gradient(#f3e6cc 1px,transparent 1.5px);background-size:22px 22px;}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px 40px}
header.top{position:sticky;top:0;z-index:20;background:rgba(253,246,233,.94);backdrop-filter:blur(6px);
  border-bottom:2px dashed var(--line)}
header.top .wrap{display:flex;align-items:center;gap:10px;padding-top:10px;padding-bottom:10px}
.logo{font-size:28px;font-weight:700;letter-spacing:2px;display:flex;align-items:center;gap:8px;cursor:pointer}
.logo .ic{width:40px;height:40px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:24px;box-shadow:0 3px 0 #b8501f}
.spacer{flex:1}
.iconbtn{border:2px solid var(--line);background:var(--paper);border-radius:14px;min-width:48px;height:48px;padding:0 12px;font-size:18px}
.iconbtn:active{transform:translateY(2px)}
.hidden{display:none!important}
h2{font-size:26px;margin:28px 0 12px;display:flex;align-items:center;gap:10px}
h2 .num{width:36px;height:36px;border-radius:50%;background:var(--accent2);color:#fff;display:grid;place-items:center;font-size:20px;flex:none}
.hint{color:var(--soft);font-size:17px;margin:-4px 0 12px}

/* home */
.hero{margin:24px 0 8px;padding:22px;border-radius:24px;background:var(--paper);box-shadow:var(--shadow);border:2px solid var(--line)}
.hero h1{margin:0 0 6px;font-size:32px}
.hero p{margin:0;color:var(--soft);font-size:18px}
.choices{display:flex;flex-wrap:wrap;gap:12px}
.choice{min-width:118px;min-height:62px;padding:10px 18px;border-radius:16px;border:3px solid var(--line);background:var(--paper);font-size:22px;box-shadow:0 3px 0 var(--line);position:relative}
.choice small{display:block;font-size:14px;color:var(--soft);line-height:1.2}
.choice.on{border-color:var(--accent);background:#fff1e6;box-shadow:0 3px 0 var(--accent)}
.choice.on::after{content:"✔";position:absolute;top:-10px;right:-8px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-size:15px;display:grid;place-items:center}
.choice:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.grades{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.grades .choice{min-width:0;padding:8px 4px}
.mini-row{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.linkbtn{border:none;background:none;color:var(--accent2);text-decoration:underline;font-size:18px;padding:6px 4px}
.range{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:20px}
.range select{font:inherit;font-size:20px;padding:6px 10px;border-radius:12px;border:2px solid var(--line);background:var(--paper)}
.go-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:28px}
.bigbtn{border:none;border-radius:22px;padding:18px 20px;font-size:26px;color:#fff;background:var(--accent);box-shadow:0 6px 0 #b8501f;min-height:84px;line-height:1.3}
.bigbtn small{display:block;font-size:16px;opacity:.9}
.bigbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #b8501f}
.bigbtn:disabled{filter:grayscale(.8);opacity:.6}
.bigbtn.brawl{background:linear-gradient(135deg,#6a3fd1,#d4508f);box-shadow:0 6px 0 #4a2a99}
.bigbtn.brawl:active{box-shadow:0 2px 0 #4a2a99}

/* main */
.crumb{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:18px 0 10px}
.tag{display:inline-block;padding:2px 12px;border-radius:999px;background:#efe4cf;font-size:17px}
.tabs{display:flex;gap:8px;margin:8px 0 18px;border-bottom:3px solid var(--line);overflow-x:auto}
.tab{border:none;background:none;padding:12px 18px;font-size:22px;border-radius:14px 14px 0 0;color:var(--soft);white-space:nowrap}
.tab.on{background:var(--paper);color:var(--ink);box-shadow:0 -3px 0 var(--accent) inset;font-weight:700}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:14px}
.seg button{border:none;background:var(--paper);padding:8px 16px;font-size:18px}
.seg button.on{background:var(--accent2);color:#fff}

.group{background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden;border:2px solid var(--line)}
.group-h{padding:10px 16px;font-size:22px;display:flex;align-items:center;gap:10px;color:#fff}
.group-h .cnt{margin-left:auto;font-size:16px;background:rgba(255,255,255,.25);padding:0 10px;border-radius:999px}
.group-h.plain{background:#f5ead6;color:var(--ink)}
.plist{list-style:none;margin:0;padding:6px 10px}
.plist li{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.plist li:last-child{border-bottom:none}
.pat{font-size:24px;letter-spacing:1px}
.pat .kw{color:var(--ink);background:linear-gradient(transparent 55%,#ffe27a 55%);padding:0 2px;font-weight:700}
.pat .dots{color:#b5a58e}
.badge{display:inline-block;padding:1px 12px;border-radius:999px;color:#fff;font-size:17px;white-space:nowrap}
.where{margin-left:auto;font-size:15px;color:var(--soft)}

/* category cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.ccard{background:var(--paper);border-radius:22px;box-shadow:var(--shadow);border:3px solid var(--cc);overflow:hidden;display:flex;flex-direction:column}
.ccard .stage{background:color-mix(in srgb,var(--cc) 12%,#fff);cursor:pointer;position:relative}
.ccard .stage svg{display:block;width:100%;height:auto}
.ccard .replay{position:absolute;right:8px;bottom:6px;font-size:14px;background:rgba(255,255,255,.8);border-radius:999px;padding:0 10px;color:var(--soft)}
.ccard .body{padding:12px 16px 14px}
.ccard h3{margin:0;font-size:28px;color:var(--cc)}
.ccard .def{margin:4px 0 8px;font-size:18px}
.ccard .tip{background:color-mix(in srgb,var(--cc) 10%,#fff);border-left:5px solid var(--cc);padding:6px 10px;border-radius:8px;font-size:18px}
.ccard .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ccard .chips span{border:2px solid color-mix(in srgb,var(--cc) 40%,#fff);border-radius:10px;padding:0 8px;font-size:18px}
.ccard .none{color:var(--soft);font-size:16px;margin-top:8px}

/* svg animation helpers */
svg .a{transform-box:fill-box}
svg text{font-family:inherit}
.play .bounce{animation:bounce .5s ease-in-out 0s 4}
@keyframes bounce{50%{transform:translateY(-10px)}}
.play .heart{animation:pop 2s ease-out .4s both}
@keyframes pop{0%{opacity:0;transform:scale(.2)}30%{opacity:1;transform:scale(1.2)}50%{transform:scale(1)}100%{opacity:1}}
.play .fadeup{animation:pop 1s ease-out both}
.play .lit1{animation:lit .4s ease-out .3s both}
.play .lit2{animation:lit .4s ease-out 1.1s both}
.play .lit3{animation:lit .4s ease-out 1.9s both}
@keyframes lit{from{opacity:0}to{opacity:1}}
.play .hop{animation:hop3 2.2s ease-in-out both}
@keyframes hop3{0%{transform:translate(0,0)}12%{transform:translate(28px,-28px)}25%{transform:translate(56px,0)}37%{transform:translate(56px,0)}50%{transform:translate(84px,-28px)}62%{transform:translate(112px,0)}100%{transform:translate(112px,0)}}
.play .draw{animation:draw 1.8s ease-in-out both}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
.play .turnsign{animation:pop .8s ease-out .8s both}
.play .arrowhead{animation:lit .2s 1.7s both}
.play .dom1{animation:fall .45s ease-in .3s both}
.play .dom2{animation:fall .45s ease-in .7s both}
.play .dom3{animation:fall .45s ease-in 1.1s both}
@keyframes fall{to{transform:rotate(68deg)}}
.play .res{animation:pop .8s ease-out 1.5s both}
.play .key{animation:keyin 1.2s ease-in-out both}
@keyframes keyin{0%{transform:translateX(-60px)}70%{transform:translateX(0) rotate(0)}100%{transform:translateX(0) rotate(90deg)}}
.play .shackle{animation:open .5s ease-out 1.2s both}
@keyframes open{to{transform:translateY(-14px)}}
.play .star{animation:pop 1s ease-out 1.6s both}
.play .dot1{animation:lit .3s .2s both}.play .dot2{animation:lit .3s .5s both}
.play .cloud{animation:pop .9s ease-out .8s both}
.play .climb{animation:climb 2.4s ease-in-out both}
@keyframes climb{0%{transform:translate(0,0)}15%{transform:translate(20px,-42px)}25%{transform:translate(40px,-28px)}40%{transform:translate(58px,-72px)}50%{transform:translate(76px,-58px)}65%{transform:translate(96px,-102px)}75%{transform:translate(114px,-88px)}100%{transform:translate(114px,-88px)}}
.play .flag{animation:pop .8s ease-out 1.9s both}
.play .arrow{animation:shoot 1s cubic-bezier(.3,.7,.4,1) both}
@keyframes shoot{from{transform:translateX(-110px)}to{transform:translateX(0)}}
.play .target{animation:wob .4s ease-in-out 1s 2}
@keyframes wob{50%{transform:rotate(-6deg)}}
.play .walker{animation:walk 2.4s ease-in-out both}
@keyframes walk{0%{transform:translate(0,0)}35%{transform:translate(0,-40px)}55%{transform:translate(0,-40px)}100%{transform:translate(-38px,-78px)}}
.play .signA{animation:blink .3s 1s 3 alternate}
.play .signB{animation:blink .3s 1.15s 3 alternate}
@keyframes blink{to{opacity:.25}}

/* game hub */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.gtile{border:3px solid var(--line);background:var(--paper);border-radius:22px;padding:16px;text-align:left;box-shadow:var(--shadow);min-height:150px;display:flex;flex-direction:column;gap:4px}
.gtile .em{font-size:44px;line-height:1}
.gtile b{font-size:24px}
.gtile span{font-size:17px;color:var(--soft)}
.gtile:active{transform:translateY(3px)}
.gtile.brawl{border-color:#8a63d2;background:linear-gradient(135deg,#f4edff,#ffe9f3)}

/* game screen */
.gbar{display:flex;align-items:center;gap:10px;margin:16px 0;flex-wrap:wrap}
#quitGame{white-space:nowrap}
.gbar h3{margin:0;font-size:24px}
.prog{flex:1;height:14px;background:#efe4cf;border-radius:999px;overflow:hidden;min-width:60px}
.prog i{display:block;height:100%;background:var(--accent2);width:0;transition:width .3s}
.hearts{font-size:22px;letter-spacing:2px}
.panel{background:var(--paper);border-radius:24px;box-shadow:var(--shadow);border:2px solid var(--line);padding:22px;text-align:center}
.qlabel{color:var(--soft);font-size:18px}
.qbig{font-size:40px;margin:10px 0 18px;letter-spacing:2px}
.qbig .blank{display:inline-block;min-width:2.4em;border-bottom:4px solid var(--accent);color:var(--accent)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{border:3px solid var(--line);background:#fff;border-radius:18px;font-size:26px;min-height:72px;padding:8px;box-shadow:0 4px 0 var(--line)}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt.right{border-color:var(--good);background:#e5f6ea;box-shadow:0 4px 0 var(--good)}
.opt.wrong{border-color:var(--bad);background:#fde8e8;box-shadow:0 4px 0 var(--bad);animation:shake .4s}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.feedback{min-height:64px;margin-top:14px;font-size:20px}
.feedback .ok{color:var(--good);font-size:24px}
.feedback .no{color:var(--bad);font-size:24px}
.nextbtn{margin-top:10px;border:none;background:var(--accent2);color:#fff;border-radius:16px;padding:10px 32px;font-size:22px;box-shadow:0 4px 0 #1f6a61}
.combo{color:#d4508f;font-size:20px}
.oddgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.oddgrid .opt{font-size:26px}
.tf{display:flex;gap:16px;justify-content:center}
.tf .opt{width:150px;font-size:44px}

.panel.exam{text-align:left}
.examtag{display:inline-block;margin:6px 0 8px;padding:2px 14px;border-radius:999px;background:linear-gradient(135deg,#6a3fd1,#d4508f);color:#fff;font-size:18px}
.stem{font-size:21px;margin-bottom:10px}
.examBox{border:2px solid var(--ink);padding:8px 12px;margin:0 0 14px;font-size:22px;border-radius:4px;background:#fff}
.opts1{display:grid;gap:10px}
.opts1 .opt{font-size:20px;text-align:left;min-height:56px;padding:8px 14px;line-height:1.5}
.panel.exam .feedback{text-align:left}
.examlist{margin:0 auto;border-collapse:collapse;font-size:17px;max-width:100%}
.examlist th,.examlist td{border-bottom:1px dashed var(--line);padding:4px 10px;text-align:left}
.examlist th{color:var(--soft);font-weight:normal}
.examlist .nw{white-space:nowrap}.examlist small{color:var(--soft)}
/* sort */
.baskets{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.basket{border:3px dashed var(--cc);border-radius:20px;background:color-mix(in srgb,var(--cc) 8%,#fff);min-height:120px;padding:8px;font-size:22px;color:var(--cc);display:flex;flex-direction:column;align-items:center;gap:4px}
.basket .bi{font-size:36px;line-height:1}
.basket .got{font-size:15px;color:var(--ink);display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.basket .got span{background:#fff;border-radius:8px;padding:0 6px}
.basket.ready{border-style:solid;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.03)}}
.tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.tile{border:3px solid var(--line);background:#fff;border-radius:16px;font-size:24px;padding:8px 14px;box-shadow:0 4px 0 var(--line)}
.tile.sel{border-color:var(--accent);background:#fff1e6;transform:translateY(-4px)}
.tile.bye{animation:bye .4s forwards}
@keyframes bye{to{transform:scale(0);opacity:0}}

/* memory */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mcard{aspect-ratio:4/3;perspective:600px;border:none;background:none;padding:0}
.mcard .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.mcard.flip .in,.mcard.done .in{transform:rotateY(180deg)}
.mcard .f,.mcard .b{position:absolute;inset:0;border-radius:16px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:6px;font-size:22px;line-height:1.3}
.mcard .f{background:repeating-linear-gradient(45deg,#f2b632,#f2b632 10px,#f5c55a 10px,#f5c55a 20px);color:#fff;font-size:34px;box-shadow:0 4px 0 #c48d14}
.mcard .b{background:#fff;border:3px solid var(--line);transform:rotateY(180deg)}
.mcard .b.cat{color:#fff;border:none;font-size:28px}
.mcard.done .b{box-shadow:0 0 0 4px var(--good)}
.stat{display:flex;gap:18px;justify-content:center;font-size:20px;margin-bottom:12px}

/* bubbles */
.pond{position:relative;height:460px;border-radius:24px;overflow:hidden;background:linear-gradient(#bfe8f2,#e9f8fb);border:3px solid #9fd6e3}
.targetbar{text-align:center;font-size:24px;margin-bottom:10px}
.targetbar .badge{font-size:24px;padding:2px 16px}
.bubble{position:absolute;bottom:-90px;border:none;border-radius:50%;width:124px;height:124px;
  background:radial-gradient(circle at 30% 30%,#fff,rgba(255,255,255,.75) 40%,rgba(180,225,240,.85));
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.9),0 4px 10px rgba(0,80,110,.15);
  font-size:20px;line-height:1.2;padding:8px;animation:rise linear forwards}
@keyframes rise{to{transform:translateY(-600px)}}
.bubble.popgood{animation:popgood .35s forwards!important}
@keyframes popgood{to{transform:scale(1.6);opacity:0}}
.bubble.popbad{background:#fde8e8;animation:popbad .5s forwards!important}
@keyframes popbad{30%{transform:translateX(-8px)}60%{transform:translateX(8px)}to{opacity:0}}
.scorefloat{position:absolute;font-size:28px;font-weight:700;pointer-events:none;animation:floatup .8s forwards}
@keyframes floatup{to{transform:translateY(-50px);opacity:0}}
.countdown{font-size:24px}

/* result */
.result h3{font-size:34px;margin:6px 0}
.stars{font-size:52px;letter-spacing:6px}
.rank{display:inline-block;margin:8px 0;padding:6px 22px;border-radius:999px;background:linear-gradient(135deg,#6a3fd1,#d4508f);color:#fff;font-size:26px}
.wronglist{text-align:left;margin:16px auto 0;max-width:560px}
.wronglist li{margin:6px 0}
.btnrow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.btn2{border:3px solid var(--line);background:#fff;border-radius:16px;padding:10px 22px;font-size:21px;box-shadow:0 4px 0 var(--line)}
.btn2.primary{border-color:var(--accent2);background:var(--accent2);color:#fff;box-shadow:0 4px 0 #1f6a61}

/* modal */
.modal{position:fixed;inset:0;background:rgba(40,25,10,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal .box{background:var(--paper);border-radius:24px;padding:22px;text-align:center;max-width:360px;width:100%}
#qrbox{display:grid;place-items:center;margin:12px 0}
#qrbox img,#qrbox canvas{width:240px!important;height:240px!important}
.confetti{position:fixed;top:-20px;width:10px;height:16px;z-index:60;pointer-events:none;animation:conf linear forwards}
@keyframes conf{to{transform:translateY(110vh) rotate(720deg)}}

/* worksheet */
.wsbtn{display:block;width:100%;margin-top:14px;border:3px dashed var(--accent2);background:var(--paper);color:var(--accent2);border-radius:18px;padding:12px;font-size:22px}
.wsbtn:disabled{opacity:.45}
.crumb .btn2{padding:4px 14px;font-size:18px}
#ws{position:fixed;inset:0;z-index:80;background:#e9e4da;overflow:auto;display:none}
#ws.open{display:block}
#ws .bar{position:sticky;top:0;z-index:2;background:#fffdf8;border-bottom:2px solid var(--line);padding:10px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}
#ws .bar .btn2{font-size:18px;padding:6px 16px}
#ws .bar label{font-size:18px;display:flex;align-items:center;gap:4px}
#ws .bar .tip{width:100%;text-align:center;font-size:15px;color:var(--soft)}
.paper{width:210mm;max-width:100%;margin:16px auto;background:#fff;color:#000;padding:14mm;box-shadow:0 4px 18px rgba(0,0,0,.15);
  font-family:"EduKai","TW-Kai","標楷體","DFKai-SB","BiauKai",serif;font-size:13.5pt;line-height:1.55}
.paper h1{font-size:22pt;margin:0;text-align:center;letter-spacing:4px}
.paper .sub{text-align:center;font-size:13pt;margin:2px 0 8px}
.paper .who{display:flex;justify-content:flex-end;gap:18px;font-size:13pt;margin-bottom:6px}
.paper .who span{border-bottom:1px solid #000;min-width:22mm;display:inline-block}
.paper h2{font-size:15pt;margin:14px 0 8px;display:block}
.paper .pat{font-size:inherit;letter-spacing:0;white-space:nowrap}
.paper .pat .kw{background:none;font-weight:700;text-decoration:underline;text-underline-offset:3px}
.paper .pat .dots{color:#000}
.wsmatch{display:flex;justify-content:space-between;border:1.5px solid #000;border-radius:3mm;padding:4mm 6mm}
.wsmatch .col{display:flex;flex-direction:column;justify-content:space-around;width:38%}
.wsmatch .it{display:flex;align-items:center;gap:3mm;min-height:11mm}
.wsmatch .l .it{justify-content:space-between}
.wsmatch .dot{width:0;height:0;border:1.6mm solid #000;border-radius:50%;flex:none}
.paper{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.wstable{width:100%;border-collapse:collapse;font-size:13pt}
.wstable th,.wstable td{border:1px solid #000;padding:1.5mm 2mm;vertical-align:middle}
.wstable th{background:#eee;font-weight:700}
.wstable td.c{text-align:center;white-space:nowrap}
.wstable .wl{border-bottom:1px dashed #777;height:8mm}

.anslist{columns:2;font-size:13pt}
@media print{
  @page{size:A4;margin:12mm}
  html,body{background:#fff!important}
  body>*:not(#ws){display:none!important}
  #ws,#ws.open{position:static;display:block!important;overflow:visible;background:#fff}

  .paper{width:auto;max-width:none;margin:0;padding:0;box-shadow:none}
}

  body{font-size:18px}

  .go-row{grid-template-columns:1fr}

}

/* ---------- 音效 ---------- */
let soundOn=true,actx=null;
function beep(type){
  if(!soundOn)return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const notes=type==="good"?[660,880]:type==="win"?[523,659,784,1046]:[220,180];
    notes.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type=type==="bad"?"square":"sine";o.frequency.value=f;
      g.gain.setValueAtTime(.12,actx.currentTime+i*.1);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+i*.1+.18);
      o.connect(g);g.connect(actx.destination);o.start(actx.currentTime+i*.1);o.stop(actx.currentTime+i*.1+.2);});
  }catch(e){}
}
$("#soundBtn").onclick=()=>{soundOn=!soundOn;$("#soundBtn").textContent=soundOn?"🔊":"🔇";};
function confetti(){const cs=["#e2703a","#2f8f83","#f2b632","#d4508f","#3b82c4","#8a63d2"];
  for(let i=0;i<60;i++){const d=document.createElement("div");d.className="confetti";d.style.left=Math.random()*100+"vw";
    d.style.background=pick(cs);d.style.animationDuration=(1.8+Math.random()*1.8)+"s";d.style.animationDelay=Math.random()*.5+"s";
    document.body.appendChild(d);setTimeout(()=>d.remove(),4200);}}

/* ---------- 狀態 ---------- */
const state={ver:"南一",grades:new Set(),from:1,to:12};
function hasData(v,g){return !!(DATA[v]&&DATA[v][g]&&DATA[v][g].length)}
function rowsFor(ver,grades,from,to){
  const out=[];
  for(const g of GRADES){if(!grades.has(g)||!hasData(ver,g))continue;
    for(const r of DATA[ver][g]){if(grades.size===1&&(r[0]<from||r[0]>to))continue;
      out.push({g,l:r[0],t:r[1],p:r[2],cat:r[3],kws:r[4]});}}
  return out;
}
function poolOf(rows){const m=new Map();
  for(const r of rows){if(!m.has(r.p))m.set(r.p,{p:r.p,cat:r.cat,where:[]});m.get(r.p).where.push(r.g+"第"+r.l+"課");}
  return [...m.values()];}

  $("#verChoices").innerHTML=VERSIONS.map(v=>{const ok=!!DATA[v];
    return `<button class="choice ${state.ver===v?"on":""}" data-v="${v}" ${ok?"":"disabled"}>${v}${ok?"":"<small>資料準備中</small>"}</button>`}).join("");
  $("#gradeChoices").innerHTML=GRADES.map(g=>{const ok=hasData(state.ver,g);
    return `<button class="choice ${state.grades.has(g)?"on":""}" data-g="${g}" ${ok?"":"disabled"}>${g}<small>${ok?DATA[state.ver][g].length+" 個":"準備中"}</small></button>`}).join("");
  document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{state.ver=b.dataset.v;state.grades.clear();renderHome();});
  document.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{const g=b.dataset.g;state.grades.has(g)?state.grades.delete(g):state.grades.add(g);renderHome();});
  $("#goBtn").disabled=state.grades.size===0;$("#wsHomeBtn").disabled=state.grades.size===0;
  const one=state.grades.size===1;
  $("#rangeBox").classList.toggle("hidden",!one);
  if(one){const g=[...state.grades][0];const ls=[...new Set(DATA[state.ver][g].map(r=>r[0]))].sort((a,b)=>a-b);
    const mx=Math.max(...ls),mn=Math.min(...ls);
    if(state.from<mn||state.from>mx)state.from=mn; if(state.to>mx||state.to<mn)state.to=mx;
    const opts=sel=>Array.from({length:mx-mn+1},(_,i)=>i+mn).map(n=>`<option ${n===sel?"selected":""}>${n}</option>`).join("");
    $("#fromL").innerHTML=opts(state.from);$("#toL").innerHTML=opts(state.to);}
  $("#brawlBtn").disabled=!DATA[state.ver];
}

let ROWS=[],POOL=[],listMode="cat";
function openMain(){
  ROWS=rowsFor(state.ver,state.grades,state.from,state.to);POOL=poolOf(ROWS);
  const gs=GRADES.filter(g=>state.grades.has(g));
  let tags=`<span class="tag">${state.ver}</span> `+gs.map(g=>`<span class="tag">${g}</span>`).join(" ");
  if(gs.length===1)tags+=` <span class="tag">第${state.from}～${state.to}課</span>`;
  tags+=` <span class="tag">共 ${POOL.length} 個句型</span>`;
  $("#crumbTags").innerHTML=tags;
  renderList();renderCards();renderGames();setTab("list");show("main");
}
function setTab(t){document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.tab===t));
  ["list","cards","games"].forEach(x=>$("#tab-"+x).classList.toggle("hidden",x!==t));
  if(t==="cards")document.querySelectorAll(".ccard .stage").forEach((s,i)=>setTimeout(()=>playAnim(s),i*150));}

  document.querySelectorAll("#listMode button").forEach(x=>x.classList.toggle("on",x===b));renderList();});

function renderList(){
  let h="";
  if(listMode==="cat"){
    for(const c of CAT_ORDER){const ps=POOL.filter(x=>x.cat===c);if(!ps.length)continue;
      h+=`<div class="group"><div class="group-h" style="background:${col(c)}">${c}複句<span class="cnt">${ps.length} 個</span></div><ul class="plist">`+
        ps.map(x=>`<li>${patHTML(x.p)}<span class="where">${x.where.join("、")}</span></li>`).join("")+`</ul></div>`;}
  }else{
    const groups=new Map();
    for(const r of ROWS){const k=r.g+"|"+r.l;if(!groups.has(k))groups.set(k,{g:r.g,l:r.l,t:r.t,items:[]});groups.get(k).items.push(r);}
    for(const gp of groups.values())
      h+=`<div class="group"><div class="group-h plain">${gp.g}　第 ${gp.l} 課${gp.t?"　"+esc(gp.t):""}<span class="cnt" style="background:#e8d9bd">${gp.items.length} 個</span></div><ul class="plist">`+
        gp.items.map(r=>`<li>${patHTML(r.p)}${badge(r.cat)}</li>`).join("")+`</ul></div>`;
  }
  $("#listBox").innerHTML=h||"<p>這個範圍沒有句型。</p>";
}
function renderCards(){
  $("#cardBox").innerHTML=CAT_ORDER.map(c=>{const ps=POOL.filter(x=>x.cat===c);

    ${ps.length?`<div class="chips">${ps.map(x=>`<span>${esc(x.p)}</span>`).join("")}</div>`:`<div class="none">這個範圍還沒有出現${c}複句。</div>`}</div></div>`}).join("");

}

}
function setProg(r){$("#gProg").style.width=Math.round(r*100)+"%";}
function notEnough(msg){$("#gBody").innerHTML=`<div class="panel"><p style="font-size:22px">${msg}</p><button class="btn2" onclick="document.getElementById('quitGame').click()">回上一頁</button></div>`;}

/* 題目產生器 */
function catOptions(ans,pool){
  const present=[...new Set(pool.map(x=>x.cat))];
  const base=present.length>=4?present:CAT_ORDER;
  return shuffle([ans,...shuffle(base.filter(c=>c!==ans)).slice(0,3)]);
}
function makeMC(x,pool){return {type:"mc",x,ask:"這個句型是哪一種複句？",show:patHTML(x.p),opts:catOptions(x.cat,pool),ans:x.cat};}
function fillable(pool){return pool.filter(x=>x.p.split("……").filter(Boolean).length>=2);}
function makeFill(x){
  const seg=x.p.split("……");const idxs=seg.map((s,i)=>s?i:-1).filter(i=>i>=0);
  const bi=pick(idxs.slice(1).length?idxs.slice(1):idxs);const ans=seg[bi];
  const cand=shuffle([...ALL_KWS]).filter(k=>{if(k===ans)return false;const t=seg.slice();t[bi]=k;return !ALL_PATTERNS.has(t.join("……"));});
  const showH='<span class="pat">'+seg.map((s,i)=>i===bi?'<span class="blank">？</span>':(s?`<span class="kw">${esc(s)}</span>`:"")).join('<span class="dots">……</span>')+'</span>';
  return {type:"fill",x,ask:"空格裡應該填哪一個關鍵詞？",show:showH,opts:shuffle([ans,...cand.slice(0,3)]),ans};
}
function makeTF(x){const truth=Math.random()<.5;const claim=truth?x.cat:pick(CAT_ORDER.filter(c=>c!==x.cat));
  return {type:"tf",x,ask:`這個句型是「${claim}複句」嗎？`,show:patHTML(x.p),opts:["⭕","❌"],ans:truth?"⭕":"❌"};}
function makeOdd(pool){
  const by={};pool.forEach(x=>(by[x.cat]=by[x.cat]||[]).push(x));
  const big=Object.keys(by).filter(c=>by[c].length>=3);if(!big.length)return null;
  const c=pick(big);const three=shuffle(by[c]).slice(0,3);const others=pool.filter(x=>x.cat!==c);if(!others.length)return null;
  const odd=pick(others);
  return {type:"odd",x:odd,ask:"哪一個句型和其他三個「不是同一類」？",show:"",opts:shuffle([...three,odd].map(y=>y.p)),ans:odd.p,group:c};
}

/* 通用問答流程（快問快答、接龍、大亂鬥共用） */
function runQuiz(qs,{title,hearts=0,onEnd}){
  let i=0,score=0,combo=0,life=hearts;const wrongs=[];
  const H=()=>{$("#gHearts").textContent=hearts?"❤️".repeat(life)+"🤍".repeat(hearts-life):"";};
  H();
  function render(){
    if(i>=qs.length||(hearts&&life<=0))return onEnd({score,total:qs.length,answered:i,wrongs,life});
    setProg(i/qs.length);const q=qs[i];
    const optsH=q.type==="exam"?`<div class="opts1">${q.opts.map((o,k)=>`<button class="opt" data-o="${k}"><b>${CIRC[k]}</b> ${esc(o)}</button>`).join("")}</div>`
      :q.type==="tf"?`<div class="tf">${q.opts.map(o=>`<button class="opt" data-o="${esc(o)}">${o}</button>`).join("")}</div>`
      :`<div class="${q.type==="odd"?"oddgrid":"opts"}">${q.opts.map(o=>`<button class="opt" data-o="${esc(o)}">${q.type==="odd"?patHTML(o):esc(o)}</button>`).join("")}</div>`;
    $("#gBody").innerHTML=q.type==="exam"?`<div class="panel exam"><div class="qlabel">第 ${i+1} / ${qs.length} 題</div>
      <div class="examtag">📝 ${q.y} 年學力檢測・${q.g}年級・第 ${q.no} 題</div><div class="stem">${q.stem}</div>${q.box?`<div class="examBox">${esc(q.box)}</div>`:""}
      ${optsH}<div class="feedback" id="fb"></div></div>`:`<div class="panel"><div class="qlabel">第 ${i+1} / ${qs.length} 題　${q.ask}</div>
      ${q.show?`<div class="qbig">${q.show}</div>`:"<div style='height:14px'></div>"}${optsH}<div class="feedback" id="fb"></div></div>`;
    document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(b,q));
  }
  function answer(b,q){
    document.querySelectorAll(".opt").forEach(x=>x.disabled=true);
    const ok=b.dataset.o===String(q.ans);
    document.querySelectorAll(".opt").forEach(x=>{if(x.dataset.o===String(q.ans))x.classList.add("right")});
    let exp="";
    if(q.type==="exam")exp=`正確答案是 <b>${CIRC[q.ans]}</b>。${q.exp}`;
    else if(q.type==="odd")exp=`其他三個都是${badge(q.group)}，${patHTML(q.ans)} 是 ${badge(q.x.cat)}。`;
    else if(q.type==="fill")exp=`完整句型：${patHTML(q.x.p)} ${badge(q.x.cat)}`;
    else exp=`${patHTML(q.x.p)} 是 ${badge(q.x.cat)}：${CATS[q.x.cat].tip}`;
    if(ok){score++;combo++;beep("good");}
    else{b.classList.add("wrong");combo=0;beep("bad");wrongs.push(q.type==="exam"?q:q.x);if(hearts){life--;H();}}
    $("#fb").innerHTML=(ok?`<div class="ok">答對了！${combo>=3?`<span class="combo">🔥 連續 ${combo} 題</span>`:""}</div>`:`<div class="no">再想想看</div>`)+
      `<div>${exp}</div><button class="nextbtn" id="nx">${i+1>=qs.length||(hearts&&life<=0)?"看成績":"下一題 →"}</button>`;
    $("#nx").onclick=()=>{i++;render();};
  }
  render();
}

function resultPanel({title,line,stars,rank,wrongs=[],retry,retryWrong}){
  setProg(1);
  const uniq=[...new Map(wrongs.map(w=>[w.p||w.id,w])).values()];
  const isExam=uniq.length&&uniq[0].type==="exam";
  $("#gBody").innerHTML=`<div class="panel result">
    ${stars!=null?`<div class="stars">${"⭐".repeat(stars)}${"☆".repeat(3-stars)}</div>`:""}
    <h3>${title}</h3>${rank?`<div class="rank">${rank}</div>`:""}<p style="font-size:22px">${line}</p>
    ${uniq.length?`<div class="wronglist"><b>${isExam?"要再看一次的考題：":"要再複習的句型："}</b><ul>${uniq.map(w=>isExam?`<li>${w.y} 年${w.g}年級第 ${w.no} 題：答案 ${CIRC[w.ans]}，${w.key}</li>`:`<li>${patHTML(w.p)} ${badge(w.cat)}</li>`).join("")}</ul></div>`:""}
    <div class="btnrow">${uniq.length&&retryWrong?`<button class="btn2 primary" id="rw">${isExam?"只練錯的考題":"只練錯的句型"}</button>`:""}
    <button class="btn2 ${uniq.length&&retryWrong?"":"primary"}" id="ra">再玩一次</button><button class="btn2" id="rb">回去</button></div></div>`;
  if(stars===3||(rank&&stars>=2))confetti();beep("win");
  $("#ra").onclick=retry;$("#rb").onclick=()=>$("#quitGame").click();
  if($("#rw"))$("#rw").onclick=()=>retryWrong(uniq);
}
const starOf=(s,t)=>t?(s/t>=.9?3:s/t>=.6?2:s/t>0?1:0):0;

/* 1. 快問快答 */
function gameMC(pool){
  if(pool.length<1)return notEnough("句型太少，請多選幾個年段或課次。");
  const qs=shuffle(pool).slice(0,10).map(x=>makeMC(x,pool));
  runQuiz(qs,{onEnd:r=>resultPanel({title:"快問快答完成！",line:`答對 ${r.score} / ${r.total} 題`,stars:starOf(r.score,r.total),wrongs:r.wrongs,
    retry:()=>startGame("mc",pool),retryWrong:w=>{$("#gTitle").textContent="快問快答（錯題再練）";gameMC2(w,pool)}})});
}
function gameMC2(w,pool){const qs=shuffle(w).map(x=>makeMC(x,pool));
  runQuiz(qs,{onEnd:r=>resultPanel({title:"錯題再練完成！",line:`答對 ${r.score} / ${r.total} 題`,stars:starOf(r.score,r.total),wrongs:r.wrongs,
    retry:()=>startGame("mc",pool),retryWrong:ww=>gameMC2(ww,pool)})});}

/* 4. 關鍵詞接龍 */
function gameFill(pool){
  const fp=fillable(pool);if(fp.length<2)return notEnough("這個範圍可以接龍的句型太少，請多選幾個年段或課次。");
  const qs=shuffle(fp).slice(0,10).map(makeFill);
  runQuiz(qs,{onEnd:r=>resultPanel({title:"接龍完成！",line:`答對 ${r.score} / ${r.total} 題`,stars:starOf(r.score,r.total),wrongs:r.wrongs,
    retry:()=>startGame("fill",pool),retryWrong:w=>{const q2=shuffle(w).map(makeFill);runQuiz(q2,{onEnd:r2=>resultPanel({title:"錯題再練完成！",line:`答對 ${r2.score} / ${r2.total} 題`,stars:starOf(r2.score,r2.total),wrongs:r2.wrongs,retry:()=>startGame("fill",pool)})})}})});
}

/* 2. 分類籃 */
function gameSort(pool){
  const by={};pool.forEach(x=>(by[x.cat]=by[x.cat]||[]).push(x));
  let cs=shuffle(Object.keys(by).filter(c=>by[c].length>=2)).slice(0,3);
  if(cs.length<2)cs=shuffle(Object.keys(by)).slice(0,3);
  if(cs.length<2)return notEnough("這個範圍的複句種類太少，請多選幾個年段或課次。");
  const items=shuffle(cs.flatMap(c=>shuffle(by[c]).slice(0,3)));
  let sel=null,done=0,miss=0;const wrongs=[];
  $("#gBody").innerHTML=`<p class="hint" style="text-align:center">先點一個句型，再點它屬於的籃子。</p>
    <div class="baskets" style="grid-template-columns:repeat(${cs.length},1fr)">${cs.map(c=>`<button class="basket" data-c="${c}" style="--cc:${col(c)}"><span class="bi">🧺</span>${c}<div class="got"></div></button>`).join("")}</div>
    <div class="tiles">${items.map((x,i)=>`<button class="tile" data-i="${i}">${esc(x.p)}</button>`).join("")}</div><div class="feedback" id="fb" style="text-align:center"></div>`;
  document.querySelectorAll(".tile").forEach(t=>t.onclick=()=>{document.querySelectorAll(".tile").forEach(x=>x.classList.remove("sel"));
    t.classList.add("sel");sel=t;document.querySelectorAll(".basket").forEach(b=>b.classList.add("ready"));});
  document.querySelectorAll(".basket").forEach(b=>b.onclick=()=>{
    if(!sel)return;const x=items[+sel.dataset.i];
    if(x.cat===b.dataset.c){beep("good");sel.classList.add("bye");const t=sel;setTimeout(()=>t.remove(),400);
      b.querySelector(".got").insertAdjacentHTML("beforeend",`<span>${esc(x.p)}</span>`);done++;setProg(done/items.length);
      $("#fb").innerHTML=`<span class="ok" style="color:var(--good)">放對了！</span>`;
      sel=null;document.querySelectorAll(".basket").forEach(k=>k.classList.remove("ready"));
      if(done===items.length)setTimeout(()=>resultPanel({title:"全部分類完成！",line:`放錯 ${miss} 次`,stars:miss===0?3:miss<=2?2:1,wrongs,
        retry:()=>startGame("sort",pool)}),600);
    }else{beep("bad");miss++;if(!wrongs.includes(x))wrongs.push(x);sel.classList.remove("sel");void sel.offsetWidth;sel.style.animation="shake .4s";
      const t=sel;setTimeout(()=>t.style.animation="",400);
      $("#fb").innerHTML=`<span style="color:var(--bad)">「${esc(x.p)}」不是${b.dataset.c}複句，再試試看！</span>`;
      sel=null;document.querySelectorAll(".basket").forEach(k=>k.classList.remove("ready"));}
  });
}

/* 3. 翻牌配對 */
function gameMem(pool){
  const by={};pool.forEach(x=>(by[x.cat]=by[x.cat]||[]).push(x));
  const cs=shuffle(Object.keys(by)).slice(0,6);
  if(cs.length<3)return notEnough("這個範圍的複句種類太少，請多選幾個年段或課次。");
  const pairs=cs.map(c=>pick(by[c]));
  const cards=shuffle([...pairs.map(x=>({k:x.cat,kind:"p",txt:x.p})),...cs.map(c=>({k:c,kind:"c",txt:c}))]);
  let open=[],moves=0,matched=0,lock=false,sec=0;
  $("#gBody").innerHTML=`<div class="stat"><span>翻牌次數：<b id="mv">0</b></span><span>時間：<b id="tm">0</b> 秒</span></div>
    <div class="mem">${cards.map((c,i)=>`<button class="mcard" data-i="${i}"><div class="in"><div class="f">？</div>
      <div class="b ${c.kind==="c"?"cat":""}" ${c.kind==="c"?`style="background:${col(c.k)}"`:""}>${c.kind==="c"?c.txt+"複句":esc(c.txt)}</div></div></button>`).join("")}</div>`;
  G={timers:[setInterval(()=>{sec++;const t=$("#tm");if(t)t.textContent=sec;},1000)]};
  document.querySelectorAll(".mcard").forEach(el=>el.onclick=()=>{
    if(lock||el.classList.contains("flip")||el.classList.contains("done"))return;
    el.classList.add("flip");open.push(el);
    if(open.length===2){moves++;$("#mv").textContent=moves;lock=true;
      const [a,b]=open.map(e=>cards[+e.dataset.i]);
      if(a.k===b.k&&a.kind!==b.kind){beep("good");setTimeout(()=>{open.forEach(e=>{e.classList.remove("flip");e.classList.add("done")});open=[];lock=false;matched++;setProg(matched/cs.length);
        if(matched===cs.length){clearTimers();setTimeout(()=>resultPanel({title:"全部配對成功！",line:`翻了 ${moves} 次，用了 ${sec} 秒`,stars:moves<=cs.length+2?3:moves<=cs.length*2?2:1,retry:()=>startGame("mem",pool)}),500);}},450);}
      else{setTimeout(()=>{beep("bad");open.forEach(e=>e.classList.remove("flip"));open=[];lock=false;},900);}
    }
  });
}

/* 5. 泡泡抓抓樂 */
function gameBubble(pool){
  const by={};pool.forEach(x=>(by[x.cat]=by[x.cat]||[]).push(x));
  const targets=shuffle(Object.keys(by).filter(c=>by[c].length>=1)).slice(0,3);
  if(Object.keys(by).length<2)return notEnough("這個範圍的複句種類太少，請多選幾個年段或課次。");
  let round=0,score=0,good=0,bad=0;const wrongs=[];G={timers:[]};
  function startRound(){
    if(round>=targets.length){clearTimers();return resultPanel({title:"泡泡抓抓樂結束！",line:`得分 ${score}（戳對 ${good} 個、戳錯 ${bad} 個）`,stars:score>=good*0.8&&good>=10?3:score>=6?2:score>0?1:0,wrongs,retry:()=>startGame("bub",pool)});}
    const tc=targets[round];let left=20;
    $("#gBody").innerHTML=`<div class="targetbar">第 ${round+1} 回：只戳 ${badge(tc)} 的泡泡！　<span class="countdown">⏱ <b id="cd">${left}</b></span>　得分 <b id="sc">${score}</b></div>
      <div class="pond" id="pond"><div style="position:absolute;inset:0;display:grid;place-items:center;font-size:40px;color:#4a8ea0" id="ready">準備…</div></div>`;
    const pond=$("#pond");
    const t0=setTimeout(()=>{$("#ready").remove();
      const spawn=setInterval(()=>{
        const isT=Math.random()<.45;const src=isT?by[tc]:pool.filter(x=>x.cat!==tc);const x=pick(src);
        const b=document.createElement("button");b.className="bubble";b.innerHTML=esc(x.p);
        const w=pond.clientWidth;const size=w<500?104:124;
        b.style.left=Math.random()*(w-size)+"px";b.style.animationDuration=(5.5+Math.random()*2)+"s";
        b.onclick=e=>{const r=pond.getBoundingClientRect();const fx=e.clientX-r.left,fy=e.clientY-r.top;
          if(x.cat===tc){score++;good++;beep("good");b.classList.add("popgood");floatTxt(pond,fx,fy,"+1","var(--good)");}
          else{score=Math.max(0,score-1);bad++;beep("bad");b.classList.add("popbad");floatTxt(pond,fx,fy,x.cat,"var(--bad)");if(!wrongs.includes(x))wrongs.push(x);}
          b.onclick=null;$("#sc").textContent=score;setTimeout(()=>b.remove(),500);};
        b.addEventListener("animationend",ev=>{if(ev.animationName==="rise")b.remove();});
        pond.appendChild(b);
      },850);
      const tick=setInterval(()=>{left--;const c=$("#cd");if(c)c.textContent=left;setProg((round+(20-left)/20)/targets.length);
        if(left<=0){clearInterval(spawn);clearInterval(tick);round++;setTimeout(startRound,600);}},1000);
      G.timers.push(spawn,tick);
    },1200);
    G.timers.push(t0);
  }
  startRound();
}
function floatTxt(p,x,y,t,c){const s=document.createElement("div");s.className="scorefloat";s.style.left=x+"px";s.style.top=y+"px";s.style.color=c;s.textContent=t;p.appendChild(s);setTimeout(()=>s.remove(),800);}

let examG="全部";
function startBrawl(from){
  clearTimers();backTo=from;
  $("#gTitle").textContent="🏆 學力檢測大亂鬥";setProg(0);$("#gHearts").textContent="";show("game");
  const gs=["全部","三","四","五","六"];
  const list=EXAM.filter(q=>examG==="全部"||q.g===examG);
  $("#gBody").innerHTML=`<div class="panel"><div style="font-size:56px">🏆</div><h3 style="font-size:30px;margin:4px 0">學力檢測大亂鬥</h3>
    <p style="font-size:19px;margin:6px 0 14px">這些都是 111～115 年縣市學力檢測真的考過的複句題！<br>只有 3 顆愛心 ❤️❤️❤️，答錯扣一顆，愛心用完就結束。</p>
    <div class="choices" style="justify-content:center;margin-bottom:12px">${gs.map(g=>`<button class="choice ${examG===g?"on":""}" data-eg="${g}" style="min-width:86px;min-height:52px">${g==="全部"?"全部":g+"年級"}<small>${EXAM.filter(q=>g==="全部"||q.g===g).length} 題</small></button>`).join("")}</div>
    <table class="examlist"><tr><th>哪一年的考題</th><th>考什麼</th></tr>
    ${list.map(q=>`<tr><td class="nw">${q.y} 年・${q.g}年級<br><small>第 ${q.no} 題</small></td><td>${q.key}</td></tr>`).join("")}</table>
    <button class="bigbtn brawl" id="bgo" style="max-width:320px;width:100%;margin-top:16px">開戰！</button></div>`;
  document.querySelectorAll("[data-eg]").forEach(b=>b.onclick=()=>{examG=b.dataset.eg;startBrawl(from);});
  $("#bgo").onclick=()=>runExam(shuffle(list),from);
}
function runExam(qs,from){
  const n=qs.length;
  runQuiz(qs,{hearts:3,onEnd:r=>{
    const s=r.score,ratio=s/n;
    const rank=ratio===1?"👑 學力檢測大師":ratio>=.8?"🥇 複句高手":ratio>=.5?"🥈 複句達人":ratio>0?"🥉 複句小學徒":"🌱 複句新芽";
    const line=r.life<=0?`愛心用完了！闖到第 ${r.answered} 題，答對 ${s} 題`:`${n} 題全部完成，答對 ${s} 題，剩下 ${"❤️".repeat(r.life)}`;
    resultPanel({title:r.life>0?"闖關成功！":"再接再厲！",rank,line,stars:starOf(s,n),wrongs:r.wrongs,
      retry:()=>startBrawl(from),retryWrong:w=>runExam(shuffle(w),from)});
  }});
}

/* ---------- A4 學習單 ---------- */
function wsBuild(){
  const gs=GRADES.filter(g=>state.grades.has(g));const one=gs.length===1;
  const rows=rowsFor(state.ver,state.grades,state.from,state.to);const pool=poolOf(rows);
  const range=one?`第 ${state.from}～${state.to} 課`:"";
  const sub=`${state.ver}版　${gs.join("、")}　${range}`;
  const loc=w=>one?w.replace(gs[0],""):w.replace("第","").replace("課","");
  if(!pool.length){$("#wsPaper").innerHTML="<p>這個範圍沒有句型。</p>";return sub;}
  // 連連看：盡量涵蓋不同類別，最多 8 題
  const by={};shuffle(pool).forEach(x=>(by[x.cat]=by[x.cat]||[]).push(x));
  const cs=shuffle(Object.keys(by));const n=Math.min(8,pool.length);const picked=[];
  for(let k=0;picked.length<n;k++){const c=cs[k%cs.length];if(by[c].length)picked.push(by[c].shift());}
  const right=shuffle([...new Set(picked.map(x=>x.cat))]);const AB="ABCDEFGHI";
  const leftH=picked.map((x,i)=>`<div class="it">(${i+1}) ${patHTML(x.p)}<span class="dot"></span></div>`).join("");
  const rightH=right.map((c,i)=>`<div class="it"><span class="dot"></span>${AB[i]}　${c}複句</div>`).join("");
  // 造句表格：依複句類別排列
  const sorted=CAT_ORDER.flatMap(c=>pool.filter(x=>x.cat===c));
  const trs=sorted.map(x=>`<tr><td class="c">${x.cat}</td><td>${patHTML(x.p)}</td><td class="c">${x.where.map(loc).join("<br>")}</td><td><div class="wl"></div><div class="wl"></div></td></tr>`).join("");
  const ans=picked.map((x,i)=>`<div>(${i+1}) ${esc(x.p)} → ${AB[right.indexOf(x.cat)]} ${x.cat}複句</div>`).join("");
  $("#wsPaper").innerHTML=`<h1>複句句型學習單</h1><div class="sub">${sub}</div>
    <div class="who">班級<span></span>座號<span style="min-width:14mm"></span>姓名<span style="min-width:30mm"></span></div>
    <h2>一、連連看：把左邊的句型和右邊的複句類別用線連起來。</h2>
    <div class="wsmatch"><div class="col l">${leftH}</div><div class="col r">${rightH}</div></div>
    <h2>二、句型造句：看看每個句型屬於哪一種複句，再用這個句型造一個句子。</h2>
    <table class="wstable"><colgroup><col style="width:13%"><col style="width:25%"><col style="width:14%"><col></colgroup>
    <thead><tr><th>複句類別</th><th>句型</th><th>${one?"課次":"出處"}</th><th>造句練習</th></tr></thead><tbody>${trs}</tbody></table>
    <div class="anspage"><h2>連連看解答</h2><div class="sub" style="text-align:left">${sub}</div><div class="anslist">${ans}</div></div>`;
  return sub;
}
let wsTitle="";
function openWS(){wsTitle=`複句句型學習單 ${wsBuild().replace(/\s+/g," ")}`;$("#ws").classList.add("open");$("#ws").scrollTop=0;}
$("#wsBtn").onclick=openWS;
$("#wsHomeBtn").onclick=()=>{state.from=+$("#fromL").value||1;state.to=+$("#toL").value||12;openWS();};
$("#wsShuffle").onclick=()=>wsBuild();
$("#wsAns").onchange=e=>$("#ws").classList.toggle("noans",!e.target.checked);
$("#wsClose").onclick=()=>$("#ws").classList.remove("open");
$("#wsPrint").onclick=async()=>{
  const old=document.title;document.title=wsTitle;
  try{await Promise.race([document.fonts.load('16px "EduKai"',"複句"),new Promise(r=>setTimeout(r,3000))]);await document.fonts.ready;}catch(e){}
  window.print();setTimeout(()=>document.title=old,1000);
};
